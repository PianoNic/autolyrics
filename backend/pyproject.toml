[project]
name = "autolyrics"
version = "0.1.0"
description = "Automatic word-synced lyrics: song link in, TTML out."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Vocal separation and forced alignment. Install PyTorch first from the CUDA index so pip
# does not pull a CPU build (Blackwell GPUs such as the RTX 50xx need CUDA 12.8 or newer):
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
ml = [
    "torch>=2.8",
    "torchaudio>=2.8",
    "demucs>=4.1",
    "soundfile>=0.12",
    "num2words>=0.5",
    "unidecode>=1.3",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
autolyrics = "autolyrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
