[project]
name = "autolyrics"
version = "0.1.0"
description = "Automatic word-synced lyrics: song link in, TTML out."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "mediatorx>=1.0,<1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Vocal separation and forced alignment. Install PyTorch first from the CUDA index so pip
# does not pull a CPU build (Blackwell GPUs such as the RTX 50xx need CUDA 12.8 or newer):
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
ml = [
    "torch>=2.8",
    "torchaudio>=2.8",
    "demucs>=4.1",
    "soundfile>=0.12",
    "num2words>=0.5",
    "unidecode>=1.3",
    "numpy>=1.26",
    "pykakasi>=2.3",
    "transformers>=4.45",
    "accelerate>=1.0",
    # Pipeline v2. audio-separator itself is installed with --no-deps (its torch pin would
    # replace the CUDA build); these are the dependencies it needs:
    "beartype>=0.18.5,<0.19",
    "rotary-embedding-torch>=0.6.1,<0.7",
    "samplerate==0.1.0",
    "ml_collections",
    "einops",
    "julius",
    "diffq-fixed",
    "onnx2torch-py313",
    "onnxruntime-gpu",
    "librosa",
    "resampy",
    "pydub",
    "audioread",
    "phonemizer>=3.3",
    "espeakng-loader",
    "pyphen>=0.16",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
autolyrics = "autolyrics.cli.cli_application:CliApplication.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One namespace package, `autolyrics`, spread over the projects of src/ (the layout of a .NET
# solution): Domain, Application, Infrastructure and API each hold their own layer.
[tool.hatch.build.targets.wheel]
packages = [
    "src/Autolyrics.Domain/autolyrics",
    "src/Autolyrics.Application/autolyrics",
    "src/Autolyrics.Infrastructure/autolyrics",
    "src/Autolyrics.API/autolyrics",
]
dev-mode-dirs = [
    "src/Autolyrics.Domain",
    "src/Autolyrics.Application",
    "src/Autolyrics.Infrastructure",
    "src/Autolyrics.API",
]

[tool.pytest.ini_options]
testpaths = ["src/Autolyrics.Tests"]
pythonpath = ["src/Autolyrics.Tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/Autolyrics.Domain", "src/Autolyrics.Application", "src/Autolyrics.Infrastructure",
       "src/Autolyrics.API", "src/Autolyrics.Tests", "scripts"]
extend-exclude = ["src/Autolyrics.Frontend"]
# Vendored from fastapi-utils; kept as published.
[tool.ruff.lint.per-file-ignores]
"src/Autolyrics.API/autolyrics/api/controller.py" = ["ALL"]
