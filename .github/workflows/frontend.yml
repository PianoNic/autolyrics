name: Frontend

on:
  push:
    branches: [master]
    paths: ["src/Autolyrics.Frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [master]
    paths: ["src/Autolyrics.Frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: src/Autolyrics.Frontend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/Autolyrics.Frontend/bun.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for Playwright (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Duplication check
        run: bun run jscpd

      - name: Unit tests (jsdom)
        run: bun run test:unit

      - name: Component tests (Chromium)
        run: bun run test:component
